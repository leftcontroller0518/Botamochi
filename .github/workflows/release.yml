name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]') {
            throw "Release tag must start with v followed by a number: $env:RELEASE_TAG"
          }

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore managed dependencies
        run: dotnet restore src/Botamochi.csproj -r win-x64

      - name: Build native NVENC interop and shaders
        shell: pwsh
        run: |
          cmake -S native -B build/native -A x64
          cmake --build build/native --config Release --parallel

      - name: Publish Native AOT
        shell: pwsh
        run: |
          $nvenc = (Resolve-Path build/native/Release/BotamochiNvenc.dll).Path
          $wave = (Resolve-Path build/native/PackWave.dxil).Path
          dotnet publish src/Botamochi.csproj `
            -r win-x64 `
            -c Release `
            -p:PublishProfile=NativeAot `
            "-p:NvencLibrary=$nvenc" `
            "-p:WaveShader=$wave" `
            --no-restore `
            -o publish/win-x64
          Copy-Item README.md, LICENSE publish/win-x64/
          Copy-Item native/README.md publish/win-x64/NATIVE-README.md
          Set-Content publish/win-x64/VERSION.txt $env:RELEASE_TAG -NoNewline

      - name: Smoke test CLI
        shell: pwsh
        run: |
          & ./publish/win-x64/Botamochi.exe --help

      - name: Package release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $symbols = Get-ChildItem publish/win-x64 -Filter *.pdb
          if ($symbols) {
            Compress-Archive -Path $symbols.FullName -DestinationPath artifacts/Botamochi-symbols-win-x64.zip
            $symbols | Remove-Item
          }
          Compress-Archive -Path publish/win-x64/* -DestinationPath artifacts/Botamochi-win-x64.zip
          Get-ChildItem artifacts -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)" | Add-Content artifacts/SHA256SUMS.txt
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Botamochi-${{ env.RELEASE_TAG }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }
          if (gh release view $env:RELEASE_TAG *> $null) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            exit $LASTEXITCODE
          }
          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            "--verify-tag",
            "--generate-notes",
            "--title", "Botamochi $env:RELEASE_TAG"
          )
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += "--prerelease" }
          $arguments += $assets
          & gh @arguments
