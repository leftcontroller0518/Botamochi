name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  windows-native-aot:
    name: Windows Native AOT
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore managed dependencies
        run: dotnet restore src/Botamochi.csproj

      - name: Build native NVENC interop and shaders
        shell: pwsh
        run: |
          cmake -S native -B build/native -A x64
          cmake --build build/native --config Release --parallel

      - name: Publish Native AOT
        shell: pwsh
        run: |
          $nvenc = (Resolve-Path build/native/Release/BotamochiNvenc.dll).Path
          $wave = (Resolve-Path build/native/PackWave.dxil).Path
          dotnet publish src/Botamochi.csproj `
            -r win-x64 `
            -c Release `
            -p:PublishProfile=NativeAot `
            "-p:NvencLibrary=$nvenc" `
            "-p:WaveShader=$wave" `
            --no-restore `
            -o artifacts/win-x64

      - name: Smoke test CLI
        shell: pwsh
        run: artifacts/win-x64/Botamochi.exe --help

      - name: Upload Native AOT artifact
        uses: actions/upload-artifact@v7
        with:
          name: Botamochi-win-x64-${{ github.sha }}
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 7
